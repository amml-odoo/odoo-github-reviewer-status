<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Reviewer Leave Status — Settings</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        max-width: 420px;
        margin: 40px auto;
        padding: 0 16px;
      }
      h1 {
        font-size: 18px;
      }
      label {
        display: block;
        margin-top: 16px;
        font-size: 13px;
        font-weight: 600;
      }
      input[type="text"] {
        width: 100%;
        padding: 6px 8px;
        margin-top: 4px;
        box-sizing: border-box;
        font-size: 13px;
      }
      .row {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-top: 16px;
      }
      button {
        margin-top: 20px;
        padding: 8px 16px;
        font-size: 13px;
        cursor: pointer;
      }
      #saved {
        margin-left: 10px;
        color: #1a7f37;
        font-size: 12px;
        display: none;
      }
    </style>
  </head>
  <body>
    <h1>Reviewer Leave Status — Settings</h1>

    <label for="odooBaseUrl">Odoo instance base URL</label>
    <input type="text" id="odooBaseUrl" placeholder="https://www.odoo.com" />
    <p style="font-size: 12px; color: #57606a; margin-top: 4px;">
      You must be logged into this Odoo instance in this browser for lookups to work.
    </p>

    <div class="row">
      <input type="checkbox" id="enabled" />
      <label for="enabled" style="margin: 0;">Enable badges on GitHub PR pages</label>
    </div>

    <button id="save">Save</button>
    <span id="saved">Saved!</span>

    <script src="options.js"></script>
  </body>
</html>
